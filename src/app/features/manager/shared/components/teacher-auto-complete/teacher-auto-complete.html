<div [formGroup]="form">
    <mat-form-field  class="example-form-field" style="width: 100%;">
        <mat-label>{{ language.transform("subject_title") }}</mat-label>
        <input type="text" matInput formControlName="subject" [matAutocomplete]="autoAge">
  
         @if (form.value.ageGroup) {
            <button matSuffix matIconButton aria-label="Clear" (click)="clear()" >
                <mat-icon>close</mat-icon>
            </button>
        }
        
        <mat-autocomplete #autoAge="matAutocomplete" [displayWith]="displayFn" (optionSelected)="onTeacherSelected($event)">
            @for (item of teacherItems(); track item.id) {
                <mat-option [value]="item">{{ displayFn(item) }}</mat-option>
            }
        </mat-autocomplete>
    </mat-form-field>
</div>
