<mat-toolbar class="tool-bar" style="padding: 20px;" >
    <button 
        matIconButton
        class="sidebar-button"
        aria-label="Example icon button with a menu icon"
        (click)="matSidenav.toggle()">
        <mat-icon>menu</mat-icon>
    </button>

    <img src="logo.png" 
        alt="Logo" style="margin: 10px 0 10px  10px;" />
    <span style="margin: 10px; font-weight: 900;"> School</span>    
</mat-toolbar>

<mat-sidenav-container class="sidenav-container" [dir]="language.direction()" >
    <mat-sidenav 
        #matSidenav
        opened="false" 
        [mode]="responseScreen.isMobile() ? 'over' : 'side'"
        class= "side-nav"
        style = "width:200px"
        [opened]="!responseScreen.isMobile()">
        <div class="f-column-between">
            <mat-nav-list style="padding-top: 0;">
                <!-- {{language.direction() == 'rtl'?'side-nav-border-right':''}}  -->

                @for (item of managerState.navItems; track $index) {
                    <app-menu-item-component [navItem]="item" [level]="1"/>
                }
            </mat-nav-list>
            
            <app-setting-button-component />
        </div>
    </mat-sidenav>
    <div style="margin: 0; padding: 5px 10px; height: calc(100vh - 90px); ">
        <router-outlet/>    
    </div>
    
</mat-sidenav-container>
