
@if(!navItem.subItem){
    <app-menu-item-link-component [navItem]="navItem" [hasItems]="false"/>
}@else {
    <app-menu-item-link-component [navItem]="navItem" [hasItems]="true"/>

    @if (navItem.isExpended) {
        <div [style]="GetWidth()" >
            @for (item of navItem.subItem; track $index) {
                <app-menu-item-component [navItem]="item" [level]="level + 1"/>
            }
        </div>
        
    }
    
}
