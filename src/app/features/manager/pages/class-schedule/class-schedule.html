<div style="display: flex; justify-content: space-between;">
    <h2 >{{language.transform('class_schedule_title')}}</h2> 
    
    <div>
        <button matFab (click)="openPeriodPage()" style="margin: 0 20px ">
            <mat-icon>timeline</mat-icon>
        </button>

        <button matFab (click)="operClassPage()" style="margin: 0 20px ">
            <mat-icon>arrow_back</mat-icon>
        </button>
    </div>

</div>


<mat-expansion-panel (expandedChange)="onExpended($event)">
    <mat-expansion-panel-header>
        <mat-panel-title> {{ language.transform('add_class_period_title') }}</mat-panel-title>
    </mat-expansion-panel-header>
    @if(expended()){
        <form [formGroup]="form">
            <mat-grid-list [cols]="responsive.isMobile()?1:2" rowHeight="70px" gutterSize="10px">
                <mat-grid-tile >
                    <div style="width: 100%;">
                        <app-day-drop-down [form]="form" [checkUrl]="false" />
                    </div>
                </mat-grid-tile>
                <mat-grid-tile >
                    <div style="width: 100%;">
                        <app-subject-auto-complete [form]="form" [loading]="loading" [checkUrl]="false"/>
                    </div>
                </mat-grid-tile>
                <mat-grid-tile >
                    <div style="width: 100%;">
                        <app-period-auto-complete [form]="form" [loading]="loading" [checkUrl]="false"/>
                    </div>
                </mat-grid-tile>
                <mat-grid-tile >
                    <div style="width: 100%;">
                        <app-teacher-auto-complete [form]="form" [loading]="loading" [checkUrl]="false"/>
                    </div>
                </mat-grid-tile>
            </mat-grid-list>
        </form>
        
    }
</mat-expansion-panel>

<br/>

<mat-card>
    <table mat-table [dataSource]="dataSource()" class="mat-elevation-z8">
        @for (column of columns(); track column.key) {
            <ng-container [matColumnDef]="column.key" [sticky]="column.sticky" [stickyEnd]="column.stickyEnd">

                
                <th mat-header-cell *matHeaderCellDef style="font-weight: bold; background-color: var(--mat-sys-primary); color: var(--mat-sys-primary-fixed);   white-space: nowrap;">
                    {{column.label}}
                </th>

                <td mat-cell *matCellDef="let element">
                    {{ getSubjectName(element, column.id) }}
                    {{ getTeacherName(element, column.id) }}
                </td>

            </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>

    </table>
</mat-card>
