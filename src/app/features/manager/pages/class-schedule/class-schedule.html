<br/>
<mat-card>
    <table mat-table [dataSource]="dataSource()" class="mat-elevation-z8">

        @for (column of columns(); track column.key) {
            <ng-container [matColumnDef]="column.key" [sticky]="column.sticky" [stickyEnd]="column.stickyEnd">

                <th mat-header-cell *matHeaderCellDef style="font-weight: bold; background-color: var(--mat-sys-primary); color: var(--mat-sys-primary-fixed);   white-space: nowrap;">
                    {{column.label}}
                </th>

                <td mat-cell *matCellDef="let element">
                    {{ getSubjectName(element, column.id) }}
                    {{ getTeacherName(element, column.id) }}
                </td>

            </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>

    </table>
</mat-card>
