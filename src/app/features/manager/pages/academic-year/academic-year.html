<div style="display: flex; justify-content: flex-end;">
    <button matFab (click)="openAddDialog()">
        <mat-icon>add</mat-icon>
    </button>
</div>
<br/>
<mat-card>
    <table mat-table [dataSource]="academicYearViewModel()" class="mat-elevation-z8">

    <ng-container matColumnDef="{{headerTable[0]}}">
        <th mat-header-cell *matHeaderCellDef> {{language.transform('academic_year_title')}} </th>
        <td mat-cell *matCellDef="let element"> {{ element.academicYear }} </td>
    </ng-container>

    <ng-container matColumnDef="{{headerTable[1]}}">
        <th mat-header-cell *matHeaderCellDef> {{language.transform('created_at_title')}} </th>
        <td mat-cell *matCellDef="let element"> {{ element.createdAt|date:'yyyy-MM-dd HH:mm:ss' }} </td>
    </ng-container>

    <ng-container matColumnDef="{{headerTable[2]}}">
        <th mat-header-cell *matHeaderCellDef> {{language.transform('action')}} </th>
        <td mat-cell *matCellDef="let element"> 
            <div style="display: flex; justify-content: space-between;">
                <button mat-icon-button (click)="openDeleteDialog(element.id)">
                    <mat-icon class="icon-error">delete</mat-icon>
                </button>
                <button mat-icon-button (click)="openSemesterPage(element)">
                    <mat-icon>info</mat-icon>
                </button>
            </div>
        </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="headerTable"></tr>
    <tr mat-row *matRowDef="let row; columns: headerTable;"></tr>

    </table>
