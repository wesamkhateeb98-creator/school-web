<div style="display: flex; justify-content: start;">
    <h2>{{language.transform('academic_year_title')}}</h2>
    <button matFab (click)="openAddDialog()" style="margin: 0 20px;">
        <mat-icon>add</mat-icon>
    </button>
</div>

<br/>
<mat-card>
    @if(this.loading())
    {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    <table mat-table [dataSource]="academicYearViewModel()" class="mat-elevation-z8">

    <ng-container matColumnDef="{{headerTable[0]}}">
        <th mat-header-cell *matHeaderCellDef style="font-weight: bold;"> {{language.transform('academic_year_title')}} </th>
        <td mat-cell *matCellDef="let element"> {{ `${element.year}-${element.year + 1}` }} </td>
    </ng-container>

    <ng-container matColumnDef="{{headerTable[1]}}">
        <th mat-header-cell *matHeaderCellDef style="font-weight: bold;"> {{language.transform('created_at_title')}} </th>
        <td mat-cell *matCellDef="let element"> {{ element.createdAt|date:'yyyy-MM-dd HH:mm:ss' }} </td>
    </ng-container>

    <ng-container matColumnDef="{{headerTable[2]}}">
        <th mat-header-cell *matHeaderCellDef style="font-weight: bold;"> {{language.transform('action')}} </th>
        <td mat-cell *matCellDef="let element"> 
            <div style="display: flex; justify-content: space-between;">
                <button mat-icon-button (click)="openUpdateDialog(element)" [disabled]="element.lock">
                    <mat-icon class="icon-update">update</mat-icon>
                </button>
                <button mat-icon-button 
                        (click)="openDeleteDialog(element.id)"  
                        [disabled]="element.lock">
                    <mat-icon class="icon-error">delete</mat-icon>
                </button>
                <button mat-icon-button (click)="openDetailsDialog(element.id)">
                    <mat-icon>info</mat-icon>
                </button>
            </div>
        </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="headerTable"></tr>
    
    <tr mat-row *matRowDef="let row; columns: headerTable;"></tr>

    </table>
    <mat-paginator 
        [length]="totalPages() * filter().pageSize" 
        [pageSize]="filter().pageSize"
        [pageIndex]="filter().selectedPage - 1"
        
        [pageSizeOptions]="[5, 10, 25, 100]"
        showFirstLastButtons="false"
        (page)="changeInPage($event)"
    />
</mat-card>
