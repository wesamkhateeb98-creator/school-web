
<h2 mat-dialog-title>{{this.language.transform('end_academic_year')}}</h2>
<mat-dialog-content>

    @if(loading()){
    <mat-grid-tile>
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </mat-grid-tile>
    }
    @else{
        <mat-label>{{this.language.transform('do_you_want_end_question')}}</mat-label>
    }
</mat-dialog-content>
<mat-dialog-actions>
    <button matButton (click)="onNoClick()" [disabled]="loading()">{{language.transform('cancel')}}</button>
    <button matButton="filled" class="icon-success" cdkFocusInitial (click)="submit()" [disabled]="loading()">{{this.language.transform('end_title')}}</button>
</mat-dialog-actions>
