<form [formGroup]="form" (ngSubmit)="submit()">
  <h2 mat-dialog-title>{{ language.transform('update_study_plan') }}</h2>

  <mat-dialog-content style="min-width: 360px;">
    @if(loading()) {
      <mat-progress-bar mode="indeterminate" style="margin-bottom: 12px;"></mat-progress-bar>
    }
    <mat-form-field style="width: 100%; margin-top: 8px;">
      <mat-label>{{ language.transform('title_label') }}</mat-label>
      <input matInput formControlName="title">
      @if(form.get('title')?.hasError('required')) {
        <mat-error>{{ language.transform('field_required') }}</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" (click)="onNoClick()" [disabled]="loading()">
      {{ language.transform('cancel') }}
    </button>
    <button matButton="filled" type="submit" [disabled]="loading()">
      {{ language.transform('update') }}
    </button>
  </mat-dialog-actions>
</form>
