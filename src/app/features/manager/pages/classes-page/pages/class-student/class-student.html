<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
    <h2 style="margin: 0;">{{ language.transform('class_title') }}</h2>

    <div style="display: flex; gap: 8px; align-items: center;">
        <button mat-flat-button (click)="openAssignStudentDialog()">
            <mat-icon>person_add</mat-icon>
            {{ language.transform('add_student_to_class') }}
        </button>
        <button mat-icon-button (click)="openClassInfoPage()" [matTooltip]="language.transform('back')">
            <mat-icon>arrow_back</mat-icon>
        </button>
    </div>
</div>

<mat-expansion-panel>
    <mat-expansion-panel-header>
        <mat-panel-title> {{language.transform('filter')}}</mat-panel-title>
    </mat-expansion-panel-header>

    <form class="example-form" [formGroup]="form">
        <mat-grid-list [cols]="responsive.isMobile()?1:2" rowHeight="70px" gutterSize="10px">
            
            <mat-grid-tile>
                <mat-form-field  class="example-full-width" style="width: 100%;">
                    <mat-label>{{ language.transform("name") }}</mat-label>
                    <input type="text" matInput formControlName="name">
                </mat-form-field>
            </mat-grid-tile>            
        </mat-grid-list>
    </form>
    
</mat-expansion-panel>

<br/>

<mat-card style="overflow-x: auto;">
    @if(this.loading())
    {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    <table mat-table [dataSource]="dataSource()" class="mat-elevation-z8" style="width: 80%;">

        <ng-container matColumnDef="{{headerTable[0]}}" sticky>
            <th mat-header-cell *matHeaderCellDef style="font-weight: bold;"> {{language.transform('name')}} </th>
            <td mat-cell *matCellDef="let element"> {{ element.fullName }} </td>
        </ng-container>

        <ng-container matColumnDef="{{headerTable[1]}}" stickyEnd>
            <th mat-header-cell *matHeaderCellDef style="font-weight: bold;"> {{language.transform('action')}} </th>
            <td mat-cell *matCellDef="let element"> 
                <div style="display: flex; justify-content: space-between;">
                    <button mat-icon-button [matTooltip]="language.transform('student_personal_information')" (click)="openStudentExtraInfoDialog(element.id)">
                        <mat-icon class="icon-success">person</mat-icon>
                    </button>
                    <button mat-icon-button [matTooltip]="language.transform('notes')" (click)="openStudentNotesPage(element.id)" >
                        <mat-icon class="icon-error">note</mat-icon>
                    </button>

                    <button mat-icon-button [matTooltip]="language.transform('points')" (click)="openStudentPointsPage(element.id)" >
                        <mat-icon class="icon-update">star</mat-icon>
                    </button>

                    <button mat-icon-button [matTooltip]="language.transform('attendances')" (click)="openStudentAttendancePage(element.id)" >
                        <mat-icon class="icon-error ">check_circle</mat-icon>
                    </button>

                    <button mat-icon-button [matTooltip]="language.transform('attendances')" (click)="openStudentParentVisitsPage(element.id)" >
                        <mat-icon class="icon-error ">family_restroom</mat-icon>
                    </button>

                    <button mat-icon-button [matTooltip]="language.transform('assignments_title')" (click)="openStudentAssignmentsPage(element.id)">
                        <mat-icon class="icon-update">assignment</mat-icon>
                    </button>
                </div>
            </td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="headerTable"></tr>
        <tr mat-row *matRowDef="let row; columns: headerTable;"></tr>

    </table>
    <mat-paginator 
        [length]="totalPages() * filter().pageSize" 
        [pageSize]="filter().pageSize"
        [pageIndex]="filter().pageNumber - 1"
        
        [pageSizeOptions]="[5, 10, 25, 100]"
        showFirstLastButtons="false"
        (page)="changeInPage($event)"
    />
</mat-card>
