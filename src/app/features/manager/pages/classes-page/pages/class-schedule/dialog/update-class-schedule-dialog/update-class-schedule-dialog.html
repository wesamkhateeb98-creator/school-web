<form [formGroup]="form" (ngSubmit)="submit()">
    <mat-dialog-content>
        <h2 mat-dialog-title>
            {{ language.transform('update_class_schedule_title') }}
            {{form.hasError('teacherAssigned')}}
        </h2>

        @if (!teacherValidation()) {
     
            <app-error-title-component [message]="language.transform('hours_must_be_between_0_and_23')"/>
            <br />
     
        }

        <mat-grid-list [cols]="2" rowHeight="90px" gutterSize="15px">
            @if(loading()){
                <mat-grid-tile colspan="2">
                    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
                </mat-grid-tile>
            } @else {
                <mat-grid-tile>
                    <div style="width: 100%;">
                        <app-day-drop-down [form]="form"/>
                    </div>
                </mat-grid-tile>

                <mat-grid-tile>
                    <div style="width: 100%;">
                        <app-subject-auto-complete [form]="form" [loading]="loading" [ageGroupId]="ageGroupId"/>
                    </div>
                </mat-grid-tile>

                <mat-grid-tile>
                    <div style="width: 100%;">
                        <app-period-auto-complete [form]="form" [loading]="loading"/>
                    </div>
                </mat-grid-tile>

                <mat-grid-tile>
                    <div style="width: 100%;">
                        <app-teacher-auto-complete [form]="form" [loading]="loading"/>
                    </div>
                </mat-grid-tile>

                <mat-grid-tile>
                    <section class="example-section">
                        <mat-checkbox class="example-margin" formControlName="assignAll">{{language.transform('assign_teacher_to_this_subject')}}</mat-checkbox>
                    </section>
                </mat-grid-tile>
            }
        </mat-grid-list>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-button (click)="onNoClick()" type="button" [disabled]="loading()">
            {{ language.transform('cancel') }}
        </button>
        
        <button mat-button (click)="removeClassPeriod()" type="button" [disabled]="loading()">
            {{ language.transform('remove_class_period') }}
        </button>

        <button mat-flat-button color="primary" type="submit" [disabled]="loading() || form.invalid">
            {{ language.transform('update') }}
        </button>
    </mat-dialog-actions>
</form>
