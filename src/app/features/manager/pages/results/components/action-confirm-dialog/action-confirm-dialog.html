<h2 mat-dialog-title>{{ language.transform(data.title) }}</h2>
<mat-dialog-content>
  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  } @else {
    <p>{{ language.transform(data.message) }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onNoClick()" [disabled]="loading()">{{ language.transform('cancel') }}</button>
  <button matButton="filled" cdkFocusInitial (click)="submit()" [disabled]="loading()">{{ language.transform(data.confirmLabel) }}</button>
</mat-dialog-actions>
