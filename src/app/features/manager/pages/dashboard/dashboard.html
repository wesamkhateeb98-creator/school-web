<div class="dashboard-container">
  <h2 class="dashboard-title">{{ language.transform('dashboard') }}</h2>

  <div class="quick-grid">
    @for (link of quickLinks; track link.url) {
      <a class="quick-card" [routerLink]="link.url" matRipple>
        <div class="card-icon" [style.background-color]="link.color + '1a'" [style.color]="link.color">
          <mat-icon>{{ link.icon }}</mat-icon>
        </div>
        <span class="card-label">{{ language.transform(link.name) }}</span>
      </a>
    }
  </div>
</div>
