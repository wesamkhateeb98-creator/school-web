<div style="display: flex;">
    <h2 >{{language.transform('age_group_title')}}</h2>

    
    <button matFab (click)="openAddDialog()" style="margin: 0 20px ">
        <mat-icon>add</mat-icon>
    </button>
</div>

<br/>

<mat-card>
    <table mat-table [dataSource]="ageGroupViewModels()" class="mat-elevation-z8">

    <ng-container matColumnDef="{{headerTable[0]}}" sticky>
        <th mat-header-cell *matHeaderCellDef style="font-weight: bold;"> {{language.transform('name')}} </th>
        <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
    </ng-container>

    <ng-container matColumnDef="{{headerTable[1]}}">
        <th mat-header-cell *matHeaderCellDef style="font-weight: bold;"> {{language.transform('created_at_title')}} </th>
        <td mat-cell *matCellDef="let element"> {{ element.createdAt|date:'yyyy-MM-dd HH:mm:ss' }} </td>
    </ng-container>

    <ng-container matColumnDef="{{headerTable[2]}}" stickyEnd>
        <th mat-header-cell *matHeaderCellDef style="font-weight: bold;"> {{language.transform('action')}} </th>
        <td mat-cell *matCellDef="let element"> 
            <div style="display: flex; justify-content: space-between;">
                <button mat-icon-button (click)="openUpdateDialog(element)">
                    <mat-icon class="icon-update">edit</mat-icon>
                </button>
                
                <button mat-icon-button (click)="openDeleteDialog(element.id)">
                    <mat-icon class="icon-error">delete</mat-icon>
                </button>
                
                <button mat-icon-button (click)="openSubjectPage(element)">
                    <mat-icon>info</mat-icon>
                </button>
            </div>
        </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="headerTable"></tr>
    <tr mat-row *matRowDef="let row; columns: headerTable;"></tr>

    </table>
    <mat-paginator 
        [length]="totalPages() * filter().pageSize" 
        [pageSize]="filter().pageSize"
        [pageIndex]="filter().selectedPage - 1"
        
        [pageSizeOptions]="[5, 10, 25, 100]"
        showFirstLastButtons="false"
        (page)="changeInPage($event)"
    />
</mat-card>
