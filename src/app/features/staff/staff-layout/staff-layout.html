
<mat-sidenav-container class="sidenav-container" [dir]="language.direction()">

    <mat-sidenav
        #matSidenav
        [mode]="responseScreen.isMobile() ? 'over' : 'side'"
        class="side-nav"
        [opened]="!responseScreen.isMobile()">

        <!-- Header: Logo + School Name + Bell + Close (mobile) -->
        <div class="sidebar-header">
            <img src="logo.png" alt="Logo" />
            <span class="school-name">School</span>
            <span style="flex: 1 1 auto;"></span>
            <app-notification-bell />
            @if (responseScreen.isMobile()) {
                <button mat-icon-button (click)="matSidenav.close()" style="color: var(--mat-sys-on-primary);">
                    <mat-icon>close</mat-icon>
                </button>
            }
        </div>

        <mat-divider></mat-divider>

        <!-- Nav Items (scrollable) + Settings (pinned bottom) -->
        <div class="f-column-between">
            <mat-nav-list>
                @for (item of staffNav.navItems(); track $index) {
                    <app-menu-item-component [navItem]="item" [level]="1" />
                }
            </mat-nav-list>
            <app-setting-button-component />
        </div>

        <!-- Desktop border toggle button -->
        @if (!responseScreen.isMobile()) {
            <button mat-icon-button class="sidebar-toggle-btn" (click)="matSidenav.toggle()">
                <mat-icon>chevron_left</mat-icon>
            </button>
        }

    </mat-sidenav>

    <!-- Mobile top bar -->
    @if (responseScreen.isMobile()) {
        <div class="mobile-header">
            <button mat-icon-button (click)="matSidenav.open()">
                <mat-icon>menu</mat-icon>
            </button>
        </div>
    }

    <!-- Desktop open button (shown only when sidebar is closed) -->
    @if (!responseScreen.isMobile() && !matSidenav.opened) {
        <button mat-icon-button class="sidebar-open-btn" (click)="matSidenav.open()">
            <mat-icon>chevron_right</mat-icon>
        </button>
    }

    <!-- Main Content -->
    <div class="content-area" [class.with-mobile-header]="responseScreen.isMobile()">
        <router-outlet />
    </div>

</mat-sidenav-container>
